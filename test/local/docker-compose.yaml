services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - 4566:4566

  redis:
    image: redis:latest
    ports:
      - '6379:6379'

  activemq:
    image: apache/activemq-artemis:latest
    container_name: activemq
    ports:
    # https://artemis.apache.org/components/artemis/documentation/latest/docker.html
      - '61616:61616'
      - '8161:8161'
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
    # Raise max-disk-usage so local publishes still work on nearly-full developer disks
    # (stock Artemis defaults to 90% and blocks all producers beyond that).
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        cd /var/lib/artemis-instance
        if [[ "$${ANONYMOUS_LOGIN,,}" == "true" ]]; then
          LOGIN_OPTION="--allow-anonymous"
        else
          LOGIN_OPTION="--require-login"
        fi
        if ! [ -f ./etc/broker.xml ]; then
          /opt/activemq-artemis/bin/artemis create \
            --user "$${ARTEMIS_USER}" \
            --password "$${ARTEMIS_PASSWORD}" \
            --silent \
            $${LOGIN_OPTION} \
            $${EXTRA_ARGS:-} \
            .
          if [ -d ./etc-override ]; then
            for file in $$(ls ./etc-override); do
              cp "./etc-override/$$file" ./etc || true
            done
          fi
        fi
        sed -i 's#<max-disk-usage>[0-9]*</max-disk-usage>#<max-disk-usage>99</max-disk-usage>#' ./etc/broker.xml
        exec ./bin/artemis run

  nats:
    image: nats
    container_name: nats
    ports:
      # Client port (4222), HTTP management port (8222), Clustering port (6222)
      - "4222:4222"
      - "8222:8222"
    # Enable JetStream and set admin credentials
    command: ["-js", "--user", "admin", "--pass", "admin", "--http_port", "8222"]

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-foo}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-bar}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  pulsar:
    image: apachepulsar/pulsar:4.0.12
    container_name: pulsar
    hostname: pulsar
    ports:
      - "6650:6650"
      - "8080:8080"
    environment:
      # Dual listeners so the worker can use pulsar://pulsar:6650 while host scripts use pulsar://localhost:6650
      PULSAR_PREFIX_advertisedListeners: "internal:pulsar://pulsar:6650,external:pulsar://localhost:6650"
      PULSAR_PREFIX_advertisedListenerName: internal
      # Require explicit topic creation (see make-local-pulsar-resources.py); do not auto-create on subscribe/produce
      PULSAR_PREFIX_allowAutoTopicCreation: "false"
      PULSAR_MEM: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
    command: >
      bash -c "bin/apply-config-from-env.py conf/standalone.conf && bin/pulsar standalone"

  azure-key-vault-emulator:
    image: jamesgoulddev/azure-keyvault-emulator:latest
    container_name: azure-key-vault-emulator.vault.azure.net
    ports:
      - "4997:4997"
    volumes:
      - ./config/azure-key-vault:/https:ro
    environment:
      - ASPNETCORE_URLS=https://+:4997
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/emulator.local.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=YourSecurePassword
      - AZURE_TENANT_ID=00000000-0000-0000-0000-000000000000

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite
    ports:
      - "10001:10001" # Queue service
    command: "azurite --queueHost 0.0.0.0 --loose --skipApiVersionCheck"

  azure-service-bus-mssql:
      image: "mcr.microsoft.com/mssql/server:2022-latest"
      environment:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "${LOCAL_MSSQL_SA_PASSWORD}" # To be filled by user as per policy : https://learn.microsoft.com/en-us/sql/relational-databases/security/strong-passwords?view=sql-server-linux-ver16

  azure-service-bus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    volumes:
      - "./config/azure-service-bus/service-bus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro"
    ports:
      - "5672:5672"
      - "5300:${EMULATOR_HTTP_PORT:-5300}"
    environment:
      SQL_SERVER: azure-service-bus-mssql
      MSSQL_SA_PASSWORD: "${LOCAL_MSSQL_SA_PASSWORD}"  # Password should be same as what is set for SQL Server Linux
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: ${EMULATOR_HTTP_PORT:-5300}
      SQL_WAIT_INTERVAL: 10 # Optional: Time in seconds to wait for SQL to be ready (default is 15 seconds)
    depends_on:
      - azure-service-bus-mssql

  # Mocks Bar OAuth token + Bar HTTP API (POST /oauth/token, POST/GET /api/bar).
  # Stubs live under ./wiremock/bar/mappings. Admin UI: http://localhost:9101/__admin/
  wiremock-bar:
    image: wiremock/wiremock:3.13.1
    ports:
      - "9101:8080"
    volumes:
      - ./wiremock/bar:/home/wiremock
    entrypoint:
      - /docker-entrypoint.sh
      - --global-response-templating
      - --verbose

  google-pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: pubsub
    ports:
      - "8085:8085"
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
      - --project=local-pubsub

  worker:
    build:
      context: ../..
      args:
        TESTS_ENABLE: "${TESTS_ENABLE-1}"
    # Note: Deliberately not setting any depends_on values
    #       Testing instructions assume that initialization needs to be done
    #       between bringing up infrastructure and bringing up the worker.
    ports:
      # Health pages
      - "${HEALTH__PORT:-8081}:${HEALTH__PORT:-8081}"
    healthcheck:
      test:
        [
          "CMD",
          "./RedShirt.Example.JobWorker.HealthCheck",
          "--health-enabled",
          "${HEALTH__ENABLED:-true}",
          "--base-url",
          "http://127.0.0.1",
          "--port",
          "${HEALTH__PORT:-8081}"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    environment:
      # General
      AWS_SERVICE_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: foo
      AWS_SECRET_ACCESS_KEY: bar
      AWS_REGION: "us-east-1"
      # App-specific variables
      LOG_LEVEL: Trace
      ## Health pages
      HEALTH__ENABLED: "${HEALTH__ENABLED:-true}"
      HEALTH__PORT: "${HEALTH__PORT:-8081}"
      HEALTH__RECENT_INCIDENT_THRESHOLD_SECONDS: "${HEALTH__RECENT_INCIDENT_THRESHOLD_SECONDS:-30}"
      JOBS__HALT_ON_FAILURE: "${JOBS__HALT_ON_FAILURE:-false}"
      JOBS__TREAT_TRANSIENT_EXCEPTION_AS_FAILURE: "${JOBS__TREAT_TRANSIENT_EXCEPTION_AS_FAILURE:-false}"
      JOBS__INTERNAL_RETRY_COUNT: "${JOBS__INTERNAL_RETRY_COUNT:-2}"
      JOBS__MAX_JOB_TIME_SECONDS: "${JOBS__MAX_JOB_TIME_SECONDS:-150}"
      JOBS__TASK_WAIT_BUFFER_SECONDS: "${JOBS__TASK_WAIT_BUFFER_SECONDS:-5}"
      JOBS__TRUANT_ALERT_INTERVAL_SECONDS: "${JOBS__TRUANT_ALERT_INTERVAL_SECONDS:-30}"
      JOBS__MAX_IDLE_WAIT_SECONDS: "${JOBS__MAX_IDLE_WAIT_SECONDS:-30}"
      JOBS__WORKER_THREAD_COUNT: "${JOBS__WORKER_THREAD_COUNT:-2}"
      JOBS__LOADER_MODE__ENABLED: "${JOBS__LOADER_MODE__ENABLED:-false}"
      JOBS__LOADER_MODE__MINIMUM_BATCH_SIZE: "${JOBS__LOADER_MODE__MINIMUM_BATCH_SIZE:-5}"
      JOBS__JOB_LOGIC__ACCESS_BAR_ENABLED: "${JOBS__JOB_LOGIC__ACCESS_BAR_ENABLED:-false}"
      JOBS__IDEMPOTENCY__ENABLED: "${JOBS__IDEMPOTENCY__ENABLED:-true}"
      JOBS__IDEMPOTENCY__RESULT_CACHE_DURATION_SECONDS: "${JOBS__IDEMPOTENCY__RESULT_CACHE_DURATION_SECONDS:-300}"
      JOBS__IDEMPOTENCY__MONITOR_INTERVAL_SECONDS: "${JOBS__IDEMPOTENCY__MONITOR_INTERVAL_SECONDS:-30}"
      JOBS__IDEMPOTENCY__IDEMPOTENCY_IDS_CAN_REPEAT: "${JOBS__IDEMPOTENCY__IDEMPOTENCY_IDS_CAN_REPEAT:-false}"
      JOBS__IDEMPOTENCY__ENABLE_TRACE_LOGGING: "${JOBS__IDEMPOTENCY__ENABLE_TRACE_LOGGING:-false}"
      ## Common Distributed Execution Support Cache Options (Safety Layer Settings)
      COMMON__DISTRIBUTED__SAFETY__DISGRACE_PERIOD_SECONDS: "${COMMON__DISTRIBUTED__SAFETY__DISGRACE_PERIOD_SECONDS:-60}"
      COMMON__DISTRIBUTED__LOCKS__TIMEOUT_SECONDS: "${COMMON__DISTRIBUTED__LOCKS__TIMEOUT_SECONDS:-30}"
      ## Common Distributed Execution Support Options (Redis)
      ## Default is the SSM parameter path. Override for Azure Key Vault (e.g. common-distributed-redis).
      COMMON__DISTRIBUTED__REDIS__CONNECTION_STRING_PATH: "${COMMON__DISTRIBUTED__REDIS__CONNECTION_STRING_PATH:-/common/redis}"
      ## Common Secret Management Library (In-Memory Cache)
      COMMON__SECRETS__CACHE__FORCE_COOLDOWN_SECONDS: "${COMMON__SECRETS__CACHE__FORCE_COOLDOWN_SECONDS:-1}"
      ## Common Secret Management Library (Azure Key Vault)
      COMMON__SECRETS__AZURE_KEY_VAULT__KEY_VAULT_URL: https://azure-key-vault-emulator.vault.azure.net:4997
      # Tell the worker to generate a syntactically valid auth token for James Gould's key vault emulator
      # The below option generates a token for Key Vault auth with obviously bogus values
      # Using an obviously-bogus token that would only work on a local testing server is the only way that I can justify the blanket SSL trust that goes with it
      COMMON__SECRETS__AZURE_KEY_VAULT__GENERATE_LOCAL_TESTING_TOKEN: true
      # Docker Secrets
      # Set alternate secret path (default on null: /run/secrets)
      COMMON__SECRETS__DOCKER__DIRECTORY: null
      ## Job Management (General)
      JOB_SOURCE__FETCH_COUNT: 10
      ## Job Management (SQS)
      JOB_SOURCE__SQS__QUEUE_URL: http://localhost:4566/000000000000/input
      JOB_SOURCE__SQS__VISIBILITY_TIMEOUT_SECONDS: 300
      JOB_SOURCE__SQS__DLQ_NOT_ENABLED: true
      JOB_SOURCE__SQS__MAXIMUM_RECEIVES: 3
      JOB_SOURCE__SQS__WAIT_TIME_SECONDS: ${JOB_SOURCE__SQS__WAIT_TIME_SECONDS:-0}
      ## Job Management (Kinesis)
      USE_KINESIS: "${USE_KINESIS-0}"
      JOB_SOURCE__KINESIS__STREAM_ARN: arn:aws:kinesis:us-east-1:000000000000:stream/input
      JOB_SOURCE__KINESIS__ROUND_ROBIN_SHARDS: true
      JOB_SOURCE__KINESIS__SHUFFLE_SHARDS: false
      JOB_SOURCE__KINESIS__CHECKPOINT__TABLE_NAME: checkpoint
      JOB_SOURCE__KINESIS__CHECKPOINT__RECORD_DURATION_HOURS: 24
      JOB_SOURCE__KINESIS__FAILURES__QUEUE_URL: http://localhost:4566/000000000000/kinesis-failures
      ## Job Management (Kafka)
      USE_KAFKA: "${USE_KAFKA-0}"
      JOB_SOURCE__KAFKA__BOOTSTRAP_SERVERS: kafka:29092
      JOB_SOURCE__KAFKA__GROUP_ID: job-worker
      JOB_SOURCE__KAFKA__TOPIC: jobs
      JOB_SOURCE__KAFKA__FAILURES__QUEUE_URL: http://localhost:4566/000000000000/kafka-failures
      ## Job Management (Pulsar)
      USE_PULSAR: "${USE_PULSAR-0}"
      JOB_SOURCE__PULSAR__SERVICE_URL: pulsar://pulsar:6650
      JOB_SOURCE__PULSAR__TOPIC: persistent://public/default/jobs
      JOB_SOURCE__PULSAR__SUBSCRIPTION_NAME: job-worker
      JOB_SOURCE__PULSAR__SUBSCRIPTION_TYPE: Shared
      JOB_SOURCE__PULSAR__MAX_REDELIVER_COUNT: 3
      JOB_SOURCE__PULSAR__ACK_TIMEOUT_SECONDS: 300
      JOB_SOURCE__PULSAR__WAIT_TIME_SECONDS: ${JOB_SOURCE__PULSAR__WAIT_TIME_SECONDS:-1}
      ## Job Management (RabbitMQ)
      USE_RABBITMQ: "${USE_RABBITMQ-0}"
      USE_RABBITMQ_SUBSCRIBE: "${USE_RABBITMQ_SUBSCRIBE-0}"
      JOB_SOURCE__RABBITMQ__HOSTNAME: rabbitmq
      JOB_SOURCE__RABBITMQ__VHost: /
      JOB_SOURCE__RABBITMQ__USER_PATH: /rabbitmq/user
      JOB_SOURCE__RABBITMQ__PASSWORD_PATH: /rabbitmq/password
      JOB_SOURCE__RABBITMQ__QUEUE_NAME: RabbitQueue
      JOB_SOURCE__RABBITMQ__SUBSCRIBE: ${JOB_SOURCE__RABBITMQ__SUBSCRIBE:-false}
      ## Job Management (ActiveMQ)
      USE_ACTIVEMQ: "${USE_ACTIVEMQ-0}"
      JOB_SOURCE__ACTIVEMQ__BROKER_URI: tcp://activemq:61616
      JOB_SOURCE__ACTIVEMQ__USER_PATH: /activemq/user
      JOB_SOURCE__ACTIVEMQ__PASSWORD_PATH: /activemq/password
      JOB_SOURCE__ACTIVEMQ__QUEUE_NAME: /queue/ActiveQueue
      JOB_SOURCE__ACTIVEMQ__SUBSCRIBE: ${JOB_SOURCE__ACTIVEMQ__SUBSCRIBE:-false}
      ## Job Management (NATS)
      USE_NATS: "${USE_NATS-0}"
      JOB_SOURCE__NATS__URL: nats://nats:4222
      JOB_SOURCE__NATS__USER_PATH: /nats/user
      JOB_SOURCE__NATS__PASSWORD_PATH: /nats/password
      JOB_SOURCE__NATS__STREAM_NAME: TestStream
      JOB_SOURCE__NATS__CONSUMER_NAME: jobworker-consumer
      JOB_SOURCE__NATS__WAIT_TIME_SECONDS: ${JOB_SOURCE__NATS__WAIT_TIME_SECONDS:-0}
      JOB_SOURCE__NATS__VISIBILITY_TIMEOUT_SECONDS: ${JOB_SOURCE__NATS__VISIBILITY_TIMEOUT_SECONDS:-60}
      JOB_SOURCE__NATS__SUBSCRIBE: ${JOB_SOURCE__NATS__SUBSCRIBE:-false}
      ## Job Management (Redis Streams)
      USE_REDIS_STREAMS: "${USE_REDIS_STREAMS-0}"
      JOB_SOURCE__REDIS_STREAMS__STREAM_NAME: jobs
      JOB_SOURCE__REDIS_STREAMS__GROUP_NAME: job-worker
      JOB_SOURCE__REDIS_STREAMS__CONSUMER_NAME: worker-1
      ## Job Management (Azure Key Vault, used by both Azure Queue Storage and Azure Service Bus)
      ## Job Management (Azure Queue Storage)
      USE_AZURE_QUEUE_STORAGE: "${USE_AZURE_QUEUE_STORAGE-0}"
      JOB_SOURCE__AZURE_QUEUE_STORAGE__URI: https://not-used-in-local-testing
      ### Connection string (using default credentials)
      ### https://learn.microsoft.com/en-us/azure/storage/common/storage-configure-connection-string
      JOB_SOURCE__AZURE_QUEUE_STORAGE__CONNECTION_STRING_PATH: "azure-queue-storage-connection-string"
      JOB_SOURCE__AZURE_QUEUE_STORAGE__QUEUE_NAME: test-azure-queue
      JOB_SOURCE__AZURE_QUEUE_STORAGE__VISIBILITY_TIMEOUT_SECONDS: 300
      ## Job Management (Azure Service Bus)
      USE_AZURE_SERVICE_BUS: "${USE_AZURE_SERVICE_BUS-0}"
      JOB_SOURCE__AZURE_SERVICE_BUS__MAX_MESSAGES_PER_REQUEST: 100
      JOB_SOURCE__AZURE_SERVICE_BUS__VISIBILITY_TIMEOUT_SECONDS: 60
      JOB_SOURCE__AZURE_SERVICE_BUS__CONNECTION_STRING_PATH: "azure-service-bus-connection-string"
      JOB_SOURCE__AZURE_SERVICE_BUS__FULLY_QUALIFIED_NAMESPACE: "not.used.for.local.testing"
      JOB_SOURCE__AZURE_SERVICE_BUS__QUEUE_NAME: "test-queue"
      JOB_SOURCE__AZURE_SERVICE_BUS__WAIT_TIME_SECONDS: ${JOB_SOURCE__AZURE_SERVICE_BUS__WAIT_TIME_SECONDS:-0}
      JOB_SOURCE__AZURE_SERVICE_BUS__ABANDON_RECOVERED_FAILURES_ON_ACKNOWLEDGE: ${JOB_SOURCE__AZURE_SERVICE_BUS__ABANDON_RECOVERED_FAILURES_ON_ACKNOWLEDGE:-true}
      ## Job Management (Google Pub/Sub)
      USE_GOOGLE_PUB_SUB: "${USE_GOOGLE_PUB_SUB-0}"
      ### Official client-library hook for the emulator (host:port, no scheme)
      PUBSUB_EMULATOR_HOST: google-pubsub-emulator:8085
      PUBSUB_PROJECT_ID: local-pubsub
      JOB_SOURCE__GOOGLE_PUB_SUB__PROJECT_ID: local-pubsub
      JOB_SOURCE__GOOGLE_PUB_SUB__SUBSCRIPTION_ID: jobs-subscription
      JOB_SOURCE__GOOGLE_PUB_SUB__VISIBILITY_TIMEOUT_SECONDS: 60
      JOB_SOURCE__GOOGLE_PUB_SUB__WAIT_TIME_SECONDS: ${JOB_SOURCE__GOOGLE_PUB_SUB__WAIT_TIME_SECONDS:-0}
      JOB_SOURCE__GOOGLE_PUB_SUB__DLQ_NOT_ENABLED: true
      JOB_SOURCE__GOOGLE_PUB_SUB__MAXIMUM_RECEIVES: 3
      ## Bar connector (external HTTP dependency + OAuth client credentials)
      CONNECTORS__BAR__BASE_URL: "${CONNECTORS__BAR__BASE_URL-http://wiremock-bar:8080}"
      CONNECTORS__BAR__TOKEN_URL: "${CONNECTORS__BAR__TOKEN_URL-http://wiremock-bar:8080/oauth/token}"
      CONNECTORS__BAR__CLIENT_ID_PATH: "${CONNECTORS__BAR__CLIENT_ID_PATH-/bar/oauth/client-id}"
      CONNECTORS__BAR__CLIENT_SECRET_PATH: "${CONNECTORS__BAR__CLIENT_SECRET_PATH-/bar/oauth/client-secret}"
      CONNECTORS__BAR__SCOPE_LABEL: "${CONNECTORS__BAR__SCOPE_LABEL-audience}"
      CONNECTORS__BAR__SCOPE_VALUE: "${CONNECTORS__BAR__SCOPE_VALUE-https://bar.local/api}"
      CONNECTORS__BAR__TOKEN_REFRESH_COOLDOWN_SECONDS: "${CONNECTORS__BAR__TOKEN_REFRESH_COOLDOWN_SECONDS-30}"
      CONNECTORS__BAR__RETRY_COUNT: "${CONNECTORS__BAR__RETRY_COUNT-3}"
      CONNECTORS__BAR__FALLBACK_JWT_EXPIRY_TIME_MINUTES: "${CONNECTORS__BAR__FALLBACK_JWT_EXPIRY_TIME_MINUTES-30}"
      CONNECTORS__BAR__REASON_TO_WAIT_FALLBACK_SECONDS: "${CONNECTORS__BAR__REASON_TO_WAIT_FALLBACK_SECONDS-15}"

