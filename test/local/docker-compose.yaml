services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - 4566:4566

  redis:
    image: redis:latest
    ports:
      - '6379:6379'

  activemq:
    image: apache/activemq-artemis:latest
    container_name: activemq
    ports:
    # https://artemis.apache.org/components/artemis/documentation/latest/docker.html
      - '61616:61616'
      - '8161:8161'
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin

  nats:
    image: nats
    container_name: nats
    ports:
      # Client port (4222), HTTP management port (8222), Clustering port (6222)
      - "4222:4222"
      - "8222:8222"
    # Enable JetStream and set admin credentials
    command: ["-js", "--user", "admin", "--pass", "admin", "--http_port", "8222"]

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: foo
      RABBITMQ_DEFAULT_PASS: bar
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  azure-key-vault-emulator1:
    image: basistheory/azure-keyvault-emulator:latest
    ports:
      - 5001:5001
      - 5000:5000
    volumes:
      - ./config/azure-key-vault:/https:ro
    environment:
      - ASPNETCORE_URLS=https://+:5001;http://+:5000
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/emulator.local.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=YourSecurePassword

  azure-key-vault-emulator:
    image: jamesgoulddev/azure-keyvault-emulator:latest
    container_name: azure-key-vault-emulator.vault.azure.net
    ports:
      - "4997:4997"
    volumes:
      - ./config/azure-key-vault:/https:ro
    environment:
      - ASPNETCORE_URLS=https://+:4997
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/emulator.local.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=YourSecurePassword
      - AZURE_TENANT_ID=00000000-0000-0000-0000-000000000000

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite
    ports:
      - "10001:10001" # Queue service
    command: "azurite --queueHost 0.0.0.0 --loose"

  azure-service-bus-mssql:
      image: "mcr.microsoft.com/mssql/server:2022-latest"
      environment:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "${LOCAL_MSSQL_SA_PASSWORD}" # To be filled by user as per policy : https://learn.microsoft.com/en-us/sql/relational-databases/security/strong-passwords?view=sql-server-linux-ver16

  azure-service-bus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    volumes:
      - "./config/azure-service-bus/service-bus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro"
    ports:
      - "5672:5672"
      - "5300:${EMULATOR_HTTP_PORT:-5300}"
    environment:
      SQL_SERVER: azure-service-bus-mssql
      MSSQL_SA_PASSWORD: "${LOCAL_MSSQL_SA_PASSWORD}"  # Password should be same as what is set for SQL Server Linux
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: ${EMULATOR_HTTP_PORT:-5300}
      SQL_WAIT_INTERVAL: 10 # Optional: Time in seconds to wait for SQL to be ready (default is 15 seconds)
    depends_on:
      - azure-service-bus-mssql

  worker:
    build:
      context: ../..
      args:
        TESTS_ENABLE: "${TESTS_ENABLE-1}"
    depends_on:
      - ministack
    environment:
      # General
      AWS_SERVICE_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: foo
      AWS_SECRET_ACCESS_KEY: bar
      AWS_REGION: "us-east-1"
      # App-specific variables
      LOG_LEVEL: Trace
      JOBS__INTERNAL_RETRY_COUNT: 2
      JOBS__MAX_IDLE_WAIT_SECONDS: 30
      JOBS__WORKER_THREAD_COUNT: 2
      JOBS__LOADER__ENABLED: "${JOBS__LOADER__ENABLED-0}" # Experimental
      JOBS__LOADER__BACKLOG_SIZE: 10
      ## Common Secret Management Library (Cache)
      COMMON__SECRETS__CACHE__FORCE_COOLDOWN_SECONDS: 60
      ## Common Secret Management Library (Azure Key Vault)
      COMMON__SECRETS__AZURE_KEY_VAULT__KEY_VAULT_URL: https://azure-key-vault-emulator.vault.azure.net:4997
      # Tell the worker to generate a syntactically valid auth token for James Gould's key vault emulator
      # The below option generates a token for Key Vault auth with obviously bogus values
      # Using an obviously-bogus token that would only work on a local testing server is the only way that I can justify the blanket SSL trust that goes with it
      COMMON__SECRETS__AZURE_KEY_VAULT__GENERATE_LOCAL_TESTING_TOKEN: true
      ## Job Management (General)
      JOB_SOURCE__BATCH_SIZE: 10
      ## Job Management (SQS)
      JOB_SOURCE__SQS__QUEUE_URL: http://localhost:4566/000000000000/input
      JOB_SOURCE__SQS__VISIBILITY_TIMEOUT_SECONDS: 300
      JOB_SOURCE__SQS__DLQ_NOT_ENABLED: true
      JOB_SOURCE__SQS__MAXIMUM_RECEIVES: 3
      ## Job Management (Kinesis)
      USE_KINESIS: "${USE_KINESIS-0}"
      JOB_SOURCE__KINESIS__STREAM_ARN: arn:aws:kinesis:us-east-1:000000000000:stream/input
      JOB_SOURCE__KINESIS__ROUND_ROBIN_SHARDS: true
      JOB_SOURCE__KINESIS__SHUFFLE_SHARDS: false
      JOB_SOURCE__KINESIS__CHECKPOINT__TABLE_NAME: checkpoint
      JOB_SOURCE__KINESIS__CHECKPOINT__RECORD_DURATION_HOURS: 24
      JOB_SOURCE__KINESIS__FAILURES__QUEUE_URL: http://localhost:4566/000000000000/kinesis-failures
      JOB_SOURCE__KINESIS__REDIS__CONNECTION_STRING_PATH: /job-source/kinesis/redis
      ## Job Management (RabbitMQ)
      USE_RABBITMQ: "${USE_RABBITMQ-0}"
      JOB_SOURCE__RABBITMQ__HOSTNAME: rabbitmq
      JOB_SOURCE__RABBITMQ__VHost: /
      JOB_SOURCE__RABBITMQ__USER_PATH: /rabbitmq/user
      JOB_SOURCE__RABBITMQ__PASSWORD_PATH: /rabbitmq/password
      JOB_SOURCE__RABBITMQ__QUEUE_NAME: RabbitQueue
      ## Job Management (ActiveMQ)
      USE_ACTIVEMQ: "${USE_ACTIVEMQ-0}"
      JOB_SOURCE__ACTIVEMQ__BROKER_URI: tcp://activemq:61616
      JOB_SOURCE__ACTIVEMQ__USER_PATH: /activemq/user
      JOB_SOURCE__ACTIVEMQ__PASSWORD_PATH: /activemq/password
      JOB_SOURCE__ACTIVEMQ__QUEUE_NAME: /queue/ActiveQueue
      ## Job Management (NATS)
      USE_NATS: "${USE_NATS-0}"
      JOB_SOURCE__NATS__URL: nats://nats:4222
      JOB_SOURCE__NATS__USER_PATH: /nats/user
      JOB_SOURCE__NATS__PASSWORD_PATH: /nats/password
      JOB_SOURCE__NATS__STREAM_NAME: TestStream
      ## Jog Management (Azure Key Vault, used by both Azure Queue Storage and Azure Service Bus)
      ## Job Management (Azure Queue Storage)
      USE_AZURE_QUEUE_STORAGE: "${USE_AZURE_QUEUE_STORAGE-0}"
      JOB_SOURCE__AZURE_QUEUE_STORAGE__URI: https://not-used-in-local-testing
      ### Connection string (using default credentials)
      ### https://learn.microsoft.com/en-us/azure/storage/common/storage-configure-connection-string
      JOB_SOURCE__AZURE_QUEUE_STORAGE__CONNECTION_STRING_PATH: "azure-queue-storage-connection-string"
      JOB_SOURCE__AZURE_QUEUE_STORAGE__QUEUE_NAME: test-azure-queue
      JOB_SOURCE__AZURE_QUEUE_STORAGE__VISIBILITY_TIMEOUT_SECONDS: 300
      ## Job Management (Azure Service Bus)
      USE_AZURE_SERVICE_BUS: "${USE_AZURE_SERVICE_BUS-0}"
      JOB_SOURCE__AZURE_SERVICE_BUS__MAX_MESSAGES_PER_REQUEST: 100
      JOB_SOURCE__AZURE_SERVICE_BUS__VISIBILITY_TIMEOUT_SECONDS: 60
      JOB_SOURCE__AZURE_SERVICE_BUS__CONNECTION_STRING_PATH: "azure-service-bus-connection-string"
      JOB_SOURCE__AZURE_SERVICE_BUS__FULLY_QUALIFIED_NAMESPACE: "not.used.for.local.testing"
      JOB_SOURCE__AZURE_SERVICE_BUS__QUEUE_NAME: "test-queue"

