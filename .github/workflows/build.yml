name: Build verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - develop

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: api
      IMAGE_TAG: ci-${{ github.sha }}
      # Pinned tool downloads. When bumping a version, update its digest from the publisher:
      #   gitleaks: gitleaks_<version>_checksums.txt on the GitHub release
      #   trivy:    trivy_<version>_checksums.txt on the GitHub release
      GITLEAKS_VERSION: 8.24.2
      GITLEAKS_SHA256: fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    steps:
      # Actions are pinned to commit SHAs, because tags can be moved. The comment names the release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install gitleaks
        run: |
          ./scripts/cicd/fetch-verified.sh \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            sha256 "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          rm "$RUNNER_TEMP/gitleaks.tar.gz"
          gitleaks version

      - name: Install trivy
        run: |
          ./scripts/cicd/fetch-verified.sh \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            sha256 "$TRIVY_SHA256" "$RUNNER_TEMP/trivy.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C /usr/local/bin trivy
          rm "$RUNNER_TEMP/trivy.tar.gz"
          trivy --version

      - name: Lint
        run: ./scripts/cicd/lint.sh

      - name: Scan (program)
        run: ./scripts/cicd/scan.sh

      - name: Build and test
        run: ./scripts/cicd/build.sh

      - name: Docker build
        run: ./scripts/cicd/docker-build.sh

      - name: Docker test
        run: ./scripts/cicd/docker-test.sh

      - name: Scan (container image)
        run: ./scripts/cicd/scan-image.sh
